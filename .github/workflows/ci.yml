name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_host_tests:
        description: Run Zotero tests on a preconfigured citebloom-zotero desktop runner
        required: true
        type: boolean
        default: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      run_host_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_host_tests }}
